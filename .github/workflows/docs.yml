# Builds the MkDocs site on every push and pull request; deploys to GitHub
# Pages from main. Uses the shared workflow from git-your-ship-together.
#
# One-time setting: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until then the deploy job fails with a message saying so.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/docs-pages.yml@cc7fa6f48a612183ecd900ed15810da61b30288a # v1.17.0
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      install-command: pip install -r requirements.txt
      build-command: python3 scripts/build_mindmap.py && mkdocs build --strict
