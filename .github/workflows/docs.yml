# Builds the MkDocs site on every push and pull request; deploys to GitHub
# Pages from main, with the printable PDF beside it. Uses the shared workflow
# from git-your-ship-together.
#
# One-time setting: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until then the deploy job fails with a message saying so.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/docs-pages.yml@f344c638e1316d43514a41e4a22f172583c271fc # v1.26.0
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      install-command: pip install -r requirements.txt
      build-command: |
        python3 scripts/build_mindmap.py
        mkdocs build --strict
        python3 scripts/build_pdf.py --out site/ProjectPlus-PK0-005.pdf --commit "$GITHUB_SHA"
      egress-policy: block   # pip and the build need only the default allow-list; the PDF build fetches nothing
