# Publishes this repository's GitHub wiki from docs/ on every push to main.
# A caller of wiki-publish.yml in ChiefGyk3D/git-your-ship-together.
#
# The wiki is a generated mirror (scripts/gen_wiki.py), never a place to write:
# each publish replaces every page. Edit docs/, not the wiki.
#
# The owner does one thing once, and GitHub offers it only in the UI: a wiki's
# git remote does not exist until its first page is made. Open the Wiki tab,
# choose "Create the first page", save anything. Until then the publish job
# fails with a message naming that step; nothing else in CI is affected.
name: Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/wiki-publish.yml@8fdb8d106b11aae0f37e893bb57e9bd8e8b0e7b7 # v1.24.0
    permissions:
      contents: write  # the publish job only; the generate job holds contents: read
    with:
      python-version: "3.12"
      generate-command: python3 scripts/gen_wiki.py --out "$OUT_DIR" --commit "$SOURCE_SHA"
      egress-policy: block
