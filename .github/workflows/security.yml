# CodeQL, gitleaks, a dependency audit and dependency review on pull
# requests. The jobs live in ChiefGyk3D/git-your-ship-together.
#
# Snyk stays off (it needs a Doppler identity this repository does not have);
# CodeQL scans the two generator scripts and the workflow files themselves.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, so new advisories surface between commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@cc7fa6f48a612183ecd900ed15810da61b30288a # v1.17.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-languages: python,actions
      scorecard: true
      egress-policy: block
