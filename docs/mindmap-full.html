<script>
  const outline = "# CompTIA Project+ PK0-005\n## 1.0 Project Management Concepts\n#### 1.1 Characteristics of a project, methodologies and frameworks\n- [Start and finish](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Meaning:** Defined beginning and end, with dates and deliverables <br> **Example:** Migrate email to the cloud by 30 June\n- [Unique](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Meaning:** Each project differs in objectives, constraints and requirements <br> **Example:** A one-off ERP rollout for a single client\n- [Reason / purpose](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Meaning:** Exists to meet a business need or goal <br> **Example:** Reduce help-desk calls by 20%\n- [Part of a program](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Meaning:** A program groups related projects managed together for combined benefit <br> **Example:** Data center move: network, servers and apps projects\n- [Part of a portfolio](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Meaning:** A portfolio is all programs and projects an organization funds, aligned to strategy <br> **Example:** Everything IT is funding this year\n- [Waterfall](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** Linear and sequential. Each phase finishes before the next starts. Changes late in the project are costly. <br> **Terms to know:** Requirements, design, implementation, testing, deployment, maintenance. Predictive. Heavy documentation.\n- [Agile](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** Iterative and incremental delivery of working product, with customer feedback every cycle. <br> **Terms to know:** Sprint/iteration, backlog, self-organizing team, adaptive planning, continuous improvement, deliver value early.\n- [Scrum](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** Agile framework using time-boxed sprints (commonly 2 to 4 weeks, never longer than 1 month in the Scrum Guide). <br> **Terms to know:** Roles: Product Owner (maximizes value, owns product backlog), Scrum Master (facilitator, removes impediments), Development Team (builds the increment). Events: sprint planning, daily scrum/stand-up, sprint review, sprint retrospective. Artifacts: product backlog, sprint backlog, increment.\n- [Kanban](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** Visual pull system. Cards move across columns on a board. <br> **Terms to know:** Visualize work, limit work in progress (WIP), manage flow, cycle time, throughput, continuous delivery with no fixed iterations.\n- [Extreme Programming (XP)](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** Agile engineering practices for high-quality code. <br> **Terms to know:** Pair programming (driver and observer), test-driven development (TDD), continuous integration, simple design, refactoring, small releases, collective code ownership, on-site customer.\n- [Scaled Agile Framework (SAFe)](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** Applies Agile and Lean at enterprise scale. <br> **Terms to know:** Agile Release Train (ART, 50 to 125 people), Program Increment (PI, about 8 to 12 weeks), Lean Portfolio Management, Portfolio Kanban.\n- [DevOps](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** Joins development and operations to shorten delivery with automation and shared ownership. <br> **Terms to know:** Continuous integration (CI), continuous delivery/deployment (CD), infrastructure as code (IaC), monitoring and feedback, breaking down silos.\n- [DevSecOps](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** DevOps with security built into every stage. <br> **Terms to know:** Shift left (test security early), security as code, automated security testing, threat modeling, continuous monitoring.\n- [PRINCE2 (PRojects IN Controlled Environments)](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** Process-based, stage-by-stage method with strong governance. <br> **Terms to know:** 7 principles (continued business justification, learn from experience, defined roles, manage by stages, manage by exception, focus on products, tailor to suit). 7 themes (business case, organization, quality, plans, risk, change, progress). 7 processes (starting up, initiating, directing, controlling a stage, managing product delivery, managing stage boundaries, closing). Project Board, product-based planning.\n- [Software Development Life Cycle (SDLC)](01-concepts/#11-characteristics-of-a-project-methodologies-and-frameworks)\n  - **Core idea:** The phases software goes through, regardless of method. <br> **Terms to know:** Planning, analysis, design, implementation/coding, testing, deployment, maintenance and support. Documentation, review and evaluation, and feedback and iteration run through every phase, and iterative models loop back to earlier phases. Closure ends it with a post-implementation review.\n#### 1.2 Agile vs Waterfall\n- [Tolerance for change (requirements, budget, schedule)](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** High. Requirements change between sprints. <br> **Waterfall:** Low. Changes are costly and may restart earlier phases.\n- [Approach](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Adaptive, iterative <br> **Waterfall:** Predictive, sequential\n- [Best when](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Requirements are unclear or evolving <br> **Waterfall:** Requirements are stable and well understood\n- [Culture](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Collaborative, transparent, empowered teams <br> **Waterfall:** Hierarchical, clear role boundaries\n- [Industry fit](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Software, product development, fast-moving markets <br> **Waterfall:** Construction, aerospace, defense, heavily regulated work\n- [Product ownership](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Dedicated Product Owner prioritizes the backlog <br> **Waterfall:** Sponsor and stakeholders define scope up front\n- [Roles](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Cross-functional, self-organizing (Scrum Master, Product Owner, Developers) <br> **Waterfall:** Specialized, separate teams (design, dev, test) with a PM directing\n- [Team size](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Small (often 5 to 9) <br> **Waterfall:** Often larger, specialists per phase\n- [Resource commitment](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Ongoing, near full-time during sprints <br> **Waterfall:** Heavy at the phase where the skill is needed\n- [Communication](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Frequent and informal: daily stand-up, planning, review, retrospective <br> **Waterfall:** Formal documentation and milestone meetings\n- [Delivery](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Working increments every sprint <br> **Waterfall:** One main delivery at the end\n- [Budget and schedule](01-concepts/#12-agile-vs-waterfall)\n  - **Agile:** Time and cost fixed, scope flexible <br> **Waterfall:** Scope fixed, time and cost estimated\n#### 1.3 Change control process\n- [Change request](01-concepts/#13-change-control-process)\n  - Formal proposal to alter scope, schedule, budget or deliverables\n- [Change control log](01-concepts/#13-change-control-process)\n  - Register of all CRs with requester, date, status and decision\n- [Change control board (CCB)](01-concepts/#13-change-control-process)\n  - Group with authority to approve or reject significant changes\n- [Impact assessment](01-concepts/#13-change-control-process)\n  - Analysis of what a change affects across the project constraints\n- [Product change vs project change](01-concepts/#13-change-control-process)\n  - Product change alters what is delivered (a feature). Project change alters how it is delivered (schedule, budget, resources, plan).\n- [Scope creep](01-concepts/#13-change-control-process)\n  - Uncontrolled growth in scope with no change control and no matching time or budget\n- [Gold plating](01-concepts/#13-change-control-process)\n  - Adding extras the customer did not ask for\n- [Baseline](01-concepts/#13-change-control-process)\n  - Approved version of scope, schedule or cost used as the comparison point\n#### 1.4 Risk management\n- [Known risk](01-concepts/#14-risk-management)\n  - Identified and analyzed, so it can be planned for\n- [Unknown risk](01-concepts/#14-risk-management)\n  - Not yet identified. Covered by management reserve, not by a specific plan.\n- [Risk register](01-concepts/#14-risk-management)\n  - Central log of risks: description, probability, impact, owner, response, status\n- [Risk owner](01-concepts/#14-risk-management)\n  - Person accountable for monitoring a risk and carrying out its response\n- [Risk trigger](01-concepts/#14-risk-management)\n  - Warning sign that a risk is about to occur\n- [Contingency plan](01-concepts/#14-risk-management)\n  - Planned response that runs *if* the risk occurs\n- [Fallback plan](01-concepts/#14-risk-management)\n  - Backup used if the first response (the contingency plan) does not work. In change control the same word means a rollback plan: see the gaps\n- [Residual risk](01-concepts/#14-risk-management)\n  - Risk left after a response\n- [Secondary risk](01-concepts/#14-risk-management)\n  - New risk created by the response itself\n- [Risk appetite / tolerance](01-concepts/#14-risk-management)\n  - How much risk the organization accepts\n- [Accept](01-concepts/#14-risk-management)\n  - **Negative risk (threat):** Acknowledge and monitor, maybe set aside reserve <br> **Positive risk (opportunity):** Take the benefit if it comes, no effort to chase it\n- [Avoid](01-concepts/#14-risk-management)\n  - **Negative risk (threat):** Change the plan to remove the threat\n- [Mitigate](01-concepts/#14-risk-management)\n  - **Negative risk (threat):** Reduce probability or impact\n- [Transfer](01-concepts/#14-risk-management)\n  - **Negative risk (threat):** Shift the impact to a third party (insurance, outsourcing, warranty)\n- [Enhance](01-concepts/#14-risk-management)\n  - **Positive risk (opportunity):** Raise probability or impact of the opportunity\n- [Exploit](01-concepts/#14-risk-management)\n  - **Positive risk (opportunity):** Make sure the opportunity definitely happens\n- [Share](01-concepts/#14-risk-management)\n  - **Positive risk (opportunity):** Partner with another party who can capture it better\n#### 1.5 Issue management\n- [Issue log](01-concepts/#15-issue-management)\n  - Tracker of issues: description, status, priority, owner, due date, resolution\n- [Escalation path](01-concepts/#15-issue-management)\n  - The defined chain of people to contact when the team cannot resolve an issue\n- [Ownership](01-concepts/#15-issue-management)\n  - Each issue is assigned to a named person who is accountable\n- [Root cause analysis (RCA)](01-concepts/#15-issue-management)\n  - Finding the underlying reason, not the symptom (5 Whys, fishbone diagram)\n- [Work-around](01-concepts/#15-issue-management)\n  - Temporary fix that keeps work moving but does not remove the cause\n- [Contingency plan](01-concepts/#15-issue-management)\n  - Predefined response executed when a known risk becomes an issue\n- [Resolution plan](01-concepts/#15-issue-management)\n  - Steps, owner and date to fix the issue\n#### 1.6 Schedule development and management\n- [Hard logic / mandatory](01-concepts/#16-schedule-development-and-management)\n  - **Meaning:** Physically or contractually required order <br> **Example:** Build the server before installing software on it\n- [Soft logic / discretionary](01-concepts/#16-schedule-development-and-management)\n  - **Meaning:** Preferred order by best practice <br> **Example:** Do UI design before database tuning\n- [External](01-concepts/#16-schedule-development-and-management)\n  - **Meaning:** Depends on something outside the project <br> **Example:** Vendor delivers hardware\n- [Internal](01-concepts/#16-schedule-development-and-management)\n  - **Meaning:** Depends on another project task or team <br> **Example:** Testing waits for development\n- [Finish-to-start (FS)](01-concepts/#16-schedule-development-and-management)\n  - **Rule:** B cannot start until A finishes <br> **Frequency:** Most common\n- [Start-to-start (SS)](01-concepts/#16-schedule-development-and-management)\n  - **Rule:** B cannot start until A starts <br> **Frequency:** Parallel work\n- [Finish-to-finish (FF)](01-concepts/#16-schedule-development-and-management)\n  - **Rule:** B cannot finish until A finishes <br> **Frequency:** Documentation ends with the build\n- [Start-to-finish (SF)](01-concepts/#16-schedule-development-and-management)\n  - **Rule:** B cannot finish until A starts <br> **Frequency:** Rare (shift handover)\n- [Milestone](01-concepts/#16-schedule-development-and-management)\n  - Zero-duration marker of an important event or deliverable\n- [Estimating techniques](01-concepts/#16-schedule-development-and-management)\n  - Analogous (from similar past projects), parametric (unit rate, such as hours per line of code), bottom-up (sum of work packages), three-point, expert judgment\n- [Three-point / PERT estimate](01-concepts/#16-schedule-development-and-management)\n  - Weighted average of optimistic (O), most likely (M) and pessimistic (P). A plain triangular average is (O + M + P) / 3. Use PERT unless the question says \"simple average\".\n- [Story points](01-concepts/#16-schedule-development-and-management)\n  - Relative size estimate for agile work (Fibonacci scale, planning poker)\n- [Epic &gt; story &gt; task](01-concepts/#16-schedule-development-and-management)\n  - Epic is a large body of work. A story is a user-facing slice. A task is a unit of work to finish a story.\n- [Sprint goal](01-concepts/#16-schedule-development-and-management)\n  - Short statement of what the sprint will achieve\n- [Velocity](01-concepts/#16-schedule-development-and-management)\n  - Story points a team completes per sprint, used to forecast\n- [Backlog prioritization](01-concepts/#16-schedule-development-and-management)\n  - Ordering backlog items by value, risk and dependency\n- [Critical path](01-concepts/#16-schedule-development-and-management)\n  - Longest sequence of dependent tasks. It sets the minimum project duration. Zero total float.\n- [Float / slack](01-concepts/#16-schedule-development-and-management)\n  - How long a task can slip without delaying the next task (free float) or the end date (total float)\n- [Crashing](01-concepts/#16-schedule-development-and-management)\n  - Add resources to critical path tasks to shorten the schedule (raises cost)\n- [Fast tracking](01-concepts/#16-schedule-development-and-management)\n  - Run tasks in parallel that were planned in sequence (raises risk)\n- [Resource loading](01-concepts/#16-schedule-development-and-management)\n  - Amount of a resource assigned over time. Overallocation means more than 100% capacity.\n- [Resource leveling](01-concepts/#16-schedule-development-and-management)\n  - Adjust the schedule to remove overallocation (may extend the finish date)\n- [Contingency reserve / buffer](01-concepts/#16-schedule-development-and-management)\n  - Time or money for *known* risks, owned by the PM\n- [Management reserve](01-concepts/#16-schedule-development-and-management)\n  - Money or time for *unknown-unknowns*, released by senior management\n- [Cadence](01-concepts/#16-schedule-development-and-management)\n  - Regular rhythm of delivery, such as two-week sprints or monthly releases\n- [Baseline](01-concepts/#16-schedule-development-and-management)\n  - Approved original plan used as a benchmark\n- [Revise baseline vs rebaseline](01-concepts/#16-schedule-development-and-management)\n  - Revising updates part of the plan for approved changes. Rebaselining resets the whole baseline after major change, which loses the original variance history.\n#### 1.7 Quality management vs performance management\n- [Retrospective / lessons learned](01-concepts/#17-quality-management-vs-performance-management)\n  - Team reflects on what went well and what to improve (end of sprint or phase)\n- [Sprint review](01-concepts/#17-quality-management-vs-performance-management)\n  - End-of-sprint demo to stakeholders to get feedback on the increment\n- [Service-level agreement (SLA)](01-concepts/#17-quality-management-vs-performance-management)\n  - Contract that sets measurable service levels (uptime, response time) and penalties\n- [Key performance indicator (KPI)](01-concepts/#17-quality-management-vs-performance-management)\n  - Measurable value showing progress toward an objective\n- [Objectives and key results (OKRs)](01-concepts/#17-quality-management-vs-performance-management)\n  - Goal-setting: an objective plus measurable key results\n- [Cost variance (CV)](01-concepts/#17-quality-management-vs-performance-management)\n  - Earned value minus actual cost. Negative = over budget.\n- [Schedule variance (SV)](01-concepts/#17-quality-management-vs-performance-management)\n  - Earned value minus planned value. Negative = behind schedule.\n- [Audit](01-concepts/#17-quality-management-vs-performance-management)\n  - Formal independent review of compliance with processes or standards\n- [Inspection](01-concepts/#17-quality-management-vs-performance-management)\n  - Examination of a product or work to see if it meets requirements\n- [Verification](01-concepts/#17-quality-management-vs-performance-management)\n  - \"Did we build it *right*?\" Checks against specifications, usually internal\n- [Validation](01-concepts/#17-quality-management-vs-performance-management)\n  - \"Did we build the *right thing*?\" Customer or user confirms it meets needs\n- [Post-implementation support / warranty period](01-concepts/#17-quality-management-vs-performance-management)\n  - Time after go-live in which defects are fixed at no extra charge\n- [Unit](01-concepts/#17-quality-management-vs-performance-management)\n  - Individual functions or components in isolation, usually automated\n- [Integration](01-concepts/#17-quality-management-vs-performance-management)\n  - Combined components work together\n- [System](01-concepts/#17-quality-management-vs-performance-management)\n  - Complete system against requirements\n- [Smoke (build verification)](01-concepts/#17-quality-management-vs-performance-management)\n  - Quick high-level check that a build is stable enough to test further\n- [Regression](01-concepts/#17-quality-management-vs-performance-management)\n  - Re-test after a change to confirm nothing else broke\n- [Performance](01-concepts/#17-quality-management-vs-performance-management)\n  - The broad category: speed, response time, throughput and resource use under load. Stress testing is one kind of it.\n- [Stress](01-concepts/#17-quality-management-vs-performance-management)\n  - Push beyond normal limits to find the breaking point\n- [User acceptance (UAT)](01-concepts/#17-quality-management-vs-performance-management)\n  - Final test by real users or the customer to accept the product\n#### 1.8 Communication management\n- [Synchronous](01-concepts/#18-communication-management)\n  - Real time, everyone present at once: phone call, video meeting, live chat\n- [Asynchronous](01-concepts/#18-communication-management)\n  - Not real time, read when convenient: email, recorded video, notifications, wiki\n- [Written vs verbal](01-concepts/#18-communication-management)\n  - Written gives a record and precision. Verbal is faster and conveys tone.\n- [Formal vs informal](01-concepts/#18-communication-management)\n  - Formal: status reports, contracts, official notices. Informal: hallway chat, instant messages.\n- [Internal vs external](01-concepts/#18-communication-management)\n  - Internal: team, sponsor. External: customers, vendors, regulators.\n- [Communication platform / modality](01-concepts/#18-communication-management)\n  - The channel chosen for the audience and message (email, chat, portal, conference)\n- [Communication plan](01-concepts/#18-communication-management)\n  - Who gets what information, when, how often, in what format, and from whom\n#### 1.9 Meeting management\n- [Collaborative](01-concepts/#19-meeting-management)\n  - **Meeting type:** Workshop <br> **Purpose:** Hands-on session to build something together\n- [Collaborative](01-concepts/#19-meeting-management)\n  - **Meeting type:** Focus group <br> **Purpose:** Gather opinions from a selected group of users\n- [Collaborative](01-concepts/#19-meeting-management)\n  - **Meeting type:** Joint application development / review (JAD/JAR) <br> **Purpose:** Users and developers define or review requirements together\n- [Collaborative](01-concepts/#19-meeting-management)\n  - **Meeting type:** Brainstorming <br> **Purpose:** Generate many ideas without judging them\n- [Informative](01-concepts/#19-meeting-management)\n  - **Meeting type:** Demonstration / presentation <br> **Purpose:** Show or explain a product or topic\n- [Informative](01-concepts/#19-meeting-management)\n  - **Meeting type:** Stand-up <br> **Purpose:** Short (about 15 minute) daily team sync: done, doing, blocked\n- [Informative](01-concepts/#19-meeting-management)\n  - **Meeting type:** Status <br> **Purpose:** Share progress, risks and issues\n- [Decisive](01-concepts/#19-meeting-management)\n  - **Meeting type:** Refinement <br> **Purpose:** Clarify and size backlog items\n- [Decisive](01-concepts/#19-meeting-management)\n  - **Meeting type:** Task setting <br> **Purpose:** Assign and agree on work\n- [Decisive](01-concepts/#19-meeting-management)\n  - **Meeting type:** Project steering committee <br> **Purpose:** Senior stakeholders decide direction, funding and escalations\n- [Agenda](01-concepts/#19-meeting-management)\n  - Topics, order and time, sent before the meeting\n- [Facilitator](01-concepts/#19-meeting-management)\n  - Runs the meeting, keeps it on track\n- [Scribe](01-concepts/#19-meeting-management)\n  - Records notes and decisions\n- [Attendees / target audience](01-concepts/#19-meeting-management)\n  - Only the people needed for the topic\n- [Timeboxing](01-concepts/#19-meeting-management)\n  - Fixed time limit per topic or meeting\n- [Action items](01-concepts/#19-meeting-management)\n  - Tasks from the meeting with an owner and due date\n- [Meeting minutes](01-concepts/#19-meeting-management)\n  - Record of attendance, decisions and action items\n- [Follow-ups](01-concepts/#19-meeting-management)\n  - Distribute minutes and track action items to closure\n#### 1.10 Team and resource management\n- [Functional](01-concepts/#110-team-and-resource-management)\n  - **Who the team reports to:** Functional (department) manager <br> **PM authority:** Little to none. PM is a coordinator.\n- [Weak matrix](01-concepts/#110-team-and-resource-management)\n  - **Who the team reports to:** Functional manager, with some project work <br> **PM authority:** Low\n- [Balanced matrix](01-concepts/#110-team-and-resource-management)\n  - **Who the team reports to:** Both functional and project manager <br> **PM authority:** Moderate\n- [Strong matrix](01-concepts/#110-team-and-resource-management)\n  - **Who the team reports to:** Mostly the project manager <br> **PM authority:** High\n- [Projectized](01-concepts/#110-team-and-resource-management)\n  - **Who the team reports to:** Project manager, fully dedicated <br> **PM authority:** Highest\n- [Human, physical, capital resources](01-concepts/#110-team-and-resource-management)\n  - People, equipment and facilities, money\n- [Internal vs external](01-concepts/#110-team-and-resource-management)\n  - Employees vs contractors and vendors\n- [Shared vs dedicated](01-concepts/#110-team-and-resource-management)\n  - Used by several projects vs assigned to one\n- [Gap analysis](01-concepts/#110-team-and-resource-management)\n  - Compare current state with needed state: feature/functionality, skills, utilization\n- [Project manager (PM)](01-concepts/#110-team-and-resource-management)\n  - Plans, executes and closes the project; manages scope, schedule, budget and team\n- [Program manager](01-concepts/#110-team-and-resource-management)\n  - Coordinates multiple related projects\n- [Product manager](01-concepts/#110-team-and-resource-management)\n  - Owns product strategy and life cycle, market and launch\n- [Product owner](01-concepts/#110-team-and-resource-management)\n  - Agile role that prioritizes the backlog and maximizes value, and stays with the product for its whole life cycle\n- [Scrum master](01-concepts/#110-team-and-resource-management)\n  - Coaches the team on Scrum, removes impediments\n- [Sponsor](01-concepts/#110-team-and-resource-management)\n  - Provides funding and authority, champions the project\n- [Stakeholders](01-concepts/#110-team-and-resource-management)\n  - Anyone affected by or able to affect the project\n- [Senior management](01-concepts/#110-team-and-resource-management)\n  - Executive direction and support\n- [Project management office (PMO)](01-concepts/#110-team-and-resource-management)\n  - Standardizes methods and supports PMs across the organization\n- [Business analyst (BA)](01-concepts/#110-team-and-resource-management)\n  - Gathers and defines requirements\n- [Subject matter expert (SME)](01-concepts/#110-team-and-resource-management)\n  - Deep knowledge in one area\n- [Architect](01-concepts/#110-team-and-resource-management)\n  - Designs the technical structure\n- [Developers / engineers](01-concepts/#110-team-and-resource-management)\n  - Build the solution\n- [Testers / QA specialists](01-concepts/#110-team-and-resource-management)\n  - Verify quality, find defects\n- [End users](01-concepts/#110-team-and-resource-management)\n  - People who will use the product, key for feedback and adoption\n- [Core (operational) team](01-concepts/#110-team-and-resource-management)\n  - Work on the project day to day\n- [Extended (functional) team](01-concepts/#110-team-and-resource-management)\n  - Contribute part-time or on specific tasks\n#### 1.11 Procurement and vendor selection\n- [Request for information (RFI)](01-concepts/#111-procurement-and-vendor-selection)\n  - Learn what vendors offer. Early research, no commitment.\n- [Request for proposal (RFP)](01-concepts/#111-procurement-and-vendor-selection)\n  - Ask for a detailed solution and price when the approach is not fixed\n- [Request for bid (RFB)](01-concepts/#111-procurement-and-vendor-selection)\n  - Ask for a firm price for a clearly defined requirement\n- [Request for quote (RFQ)](01-concepts/#111-procurement-and-vendor-selection)\n  - Ask for a price on specific items or services\n- [Fixed price](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Set total price regardless of effort <br> **Who bears cost risk:** Seller\n- [Time and material (T&amp;M)](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Pay hourly rate plus materials <br> **Who bears cost risk:** Buyer\n- [Cost plus](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Pay actual costs plus a fee or percentage <br> **Who bears cost risk:** Buyer\n- [Unit price](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Pay a set price per unit delivered <br> **Who bears cost risk:** Shared (depends on quantity)\n- [Maintenance agreement](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Ongoing support after delivery, may include warranty\n- [Master service agreement (MSA)](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Umbrella terms for many future work orders\n- [Purchase order (PO)](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Buyer's authorization to purchase\n- [Terms of reference (TOR)](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Defines purpose, scope and responsibilities of an engagement\n- [Statement of work (SOW)](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Detailed scope, deliverables, tasks, timeline and acceptance for the work\n- [Non-disclosure agreement (NDA)](01-concepts/#111-procurement-and-vendor-selection)\n  - **Definition:** Legal agreement to keep information confidential\n## 2.0 Project Life Cycle Phases\n#### 2.1 Discovery / concept preparation artifacts\n- [Business case](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Documents why the project should happen: problem or opportunity, options, costs, benefits, risks\n- [Business objective](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - The measurable business outcome the project supports\n- [Return on investment (ROI) analysis](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Compares expected benefit with cost\n- [Current state vs future state](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Today's process or system compared with the desired outcome. The gap is the work.\n- [Prequalified vendor](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Supplier already vetted, so selection is faster\n- [Predetermined client](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Customer already identified before the project starts (common in service contracts)\n- [Preexisting contracts](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Agreements already in place that shape scope: client SOW, client TOR\n- [Capital expense (CapEx)](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - One-time spend on assets that last (servers, licenses bought outright). Depreciated over time.\n- [Operational expense (OpEx)](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Ongoing day-to-day cost (subscriptions, support, cloud usage). Expensed when incurred.\n- [Feasibility study](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Checks if the project is technically, financially and operationally possible\n- [Cost-benefit analysis](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Compares total cost with total benefit. Benefit-cost ratio above 1 is favorable.\n- [Payback period](02-lifecycle/#21-discovery-concept-preparation-artifacts)\n  - Time to recover the initial investment\n#### 2.2 Initiation phase\n- [Project charter](02-lifecycle/#22-initiation-phase)\n  - Document that formally authorizes the project and the PM. Contains objectives, success criteria and a preliminary scope statement. Signed by the sponsor.\n- [Project objectives](02-lifecycle/#22-initiation-phase)\n  - What the project will achieve (SMART: specific, measurable, achievable, relevant, time-bound)\n- [Success criteria](02-lifecycle/#22-initiation-phase)\n  - Measurable conditions that show the project succeeded\n- [Preliminary scope statement](02-lifecycle/#22-initiation-phase)\n  - High-level description of what is in and out of scope\n- [Stakeholder identification and assessment](02-lifecycle/#22-initiation-phase)\n  - Find stakeholders, record them in the stakeholder register, and analyze influence and interest (power/interest grid)\n- [Responsibility assignment matrix (RAM)](02-lifecycle/#22-initiation-phase)\n  - Shows who does what on each deliverable\n- [RACI](02-lifecycle/#22-initiation-phase)\n  - Responsible (does the work), Accountable (one person, final sign-off), Consulted (two-way input), Informed (one-way updates)\n- [Communication channels](02-lifecycle/#22-initiation-phase)\n  - Agreed ways the team will communicate\n- [Records management plan](02-lifecycle/#22-initiation-phase)\n  - How data and documents are stored, retained, secured and disposed of\n- [Access requirements](02-lifecycle/#22-initiation-phase)\n  - Which people need which systems, folders and tools, on a need-to-know basis\n- [Review existing artifacts](02-lifecycle/#22-initiation-phase)\n  - Reuse prior documents, lessons learned and templates\n- [Solution design](02-lifecycle/#22-initiation-phase)\n  - High-level approach to meet the need\n- [Kickoff meeting](02-lifecycle/#22-initiation-phase)\n  - First meeting with team and stakeholders to align on goals, roles, scope and plan\n#### 2.3 Planning phase\n- [Assess the resource pool](02-lifecycle/#23-planning-phase)\n  - Check who and what is available, plus a preliminary procurement needs assessment\n- [Assign project resources](02-lifecycle/#23-planning-phase)\n  - Match people and equipment to tasks\n- [Train project team members](02-lifecycle/#23-planning-phase)\n  - Fill skill gaps\n- [Communication plan](02-lifecycle/#23-planning-phase)\n  - Audience, content, method, frequency, owner. Includes meeting cadence.\n- [Detailed scope statement](02-lifecycle/#23-planning-phase)\n  - Deliverables, boundaries, assumptions, constraints, acceptance criteria\n- [Work breakdown structure (WBS)](02-lifecycle/#23-planning-phase)\n  - Hierarchical breakdown of all project work into deliverable-based work packages (the 100% rule: includes all work and only the work)\n- [WBS dictionary](02-lifecycle/#23-planning-phase)\n  - Describes each WBS element in detail\n- [Backlog](02-lifecycle/#23-planning-phase)\n  - Prioritized list of remaining work (Agile)\n- [Project schedule](02-lifecycle/#23-planning-phase)\n  - Sequenced tasks with durations, resources and dates. Establish cadences.\n- [Budget](02-lifecycle/#23-planning-phase)\n  - Cost estimates, aggregated into the cost baseline, with contingency reserve\n- [Quality assurance (QA) plan](02-lifecycle/#23-planning-phase)\n  - Standards, metrics and reviews that prevent defects\n- [Initial risk assessment](02-lifecycle/#23-planning-phase)\n  - Identify and analyze risks, build the risk register\n- [Transition / release plan](02-lifecycle/#23-planning-phase)\n  - Plans how the product moves to operations: operational training, go-live, operational handoff, and internal and external audiences\n- [Project management plan](02-lifecycle/#23-planning-phase)\n  - Master document that combines all subsidiary plans (scope, schedule, cost, quality, resource, communication, risk, procurement, stakeholder)\n- [Baselines](02-lifecycle/#23-planning-phase)\n  - Approved scope, schedule and cost baselines for measuring performance\n- [Milestones](02-lifecycle/#23-planning-phase)\n  - Key checkpoints\n- [Minimum viable product (MVP)](02-lifecycle/#23-planning-phase)\n  - Smallest version that delivers value and allows feedback\n#### 2.4 Execution phase\n- [Execute tasks per the plan](02-lifecycle/#24-execution-phase)\n  - Produce deliverables as planned\n- [Organizational change management (OCM)](02-lifecycle/#24-execution-phase)\n  - Helps people adopt the change: impacts and responses, training, communication, documentation, new knowledge bases and processes, ensuring adoption and reinforcing it over time\n- [Manage vendors](02-lifecycle/#24-execution-phase)\n  - Enforce rules of engagement, monitor performance, approve deliverables\n- [Project meetings and updates](02-lifecycle/#24-execution-phase)\n  - Regular touch points\n- [Tracking and reporting](02-lifecycle/#24-execution-phase)\n  - Team touch points, risk reporting, external status reporting, overall progress reporting, gap analysis, ad hoc reporting\n- [Update budget and timeline](02-lifecycle/#24-execution-phase)\n  - Reflect actuals and approved changes\n- [Manage conflict](02-lifecycle/#24-execution-phase)\n  - Choose a resolution style (below)\n- [Phase gate review](02-lifecycle/#24-execution-phase)\n  - Checkpoint where stakeholders decide to proceed, change or stop\n- [Collaborate / problem solve](02-lifecycle/#24-execution-phase)\n  - **How it works:** Work together to find a solution that meets everyone's needs <br> **Outcome:** Win-win, best long term\n- [Compromise](02-lifecycle/#24-execution-phase)\n  - **How it works:** Each side gives something up <br> **Outcome:** Both partly satisfied (lose-lose)\n- [Smoothing / accommodate](02-lifecycle/#24-execution-phase)\n  - **How it works:** Emphasize agreement, downplay differences <br> **Outcome:** Short-term peace, problem remains\n- [Forcing / direct](02-lifecycle/#24-execution-phase)\n  - **How it works:** One side imposes a decision with authority <br> **Outcome:** Win-lose, damages relationships\n- [Avoiding / withdraw](02-lifecycle/#24-execution-phase)\n  - **How it works:** Ignore or postpone the conflict <br> **Outcome:** Problem remains, only good to cool down\n#### 2.5 Closing phase\n- [Project evaluation](02-lifecycle/#25-closing-phase)\n  - Compare results with success criteria and the plan\n- [Validation of deliverables](02-lifecycle/#25-closing-phase)\n  - Customer formally accepts deliverables\n- [Closing contracts](02-lifecycle/#25-closing-phase)\n  - Complete and close vendor contracts, resolve claims, make final payment\n- [Removing access](02-lifecycle/#25-closing-phase)\n  - Disable accounts, badges and permissions for the team and vendors\n- [Releasing resources](02-lifecycle/#25-closing-phase)\n  - Return people, equipment and facilities\n- [Project closure meeting](02-lifecycle/#25-closing-phase)\n  - Final meeting to review outcome and next steps\n- [Closeout report](02-lifecycle/#25-closing-phase)\n  - Summary of performance, variances, deliverables and lessons\n- [Collecting stakeholder feedback](02-lifecycle/#25-closing-phase)\n  - Surveys or interviews on satisfaction\n- [Archiving documentation](02-lifecycle/#25-closing-phase)\n  - Store records per the records plan\n- [Budget reconciliation](02-lifecycle/#25-closing-phase)\n  - Compare final costs with budget and close accounts\n- [Rewards and celebration](02-lifecycle/#25-closing-phase)\n  - Recognize the team\n- [Project sign-off](02-lifecycle/#25-closing-phase)\n  - Sponsor or customer formally accepts closure\n## 3.0 Tools and Documentation\n#### 3.1 Tools used throughout the project life cycle\n- [Gantt chart](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - **What it shows:** Tasks as horizontal bars on a timeline, with durations, dependencies and progress <br> **Best used to:** Show and track the schedule\n- [Milestone chart](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - **What it shows:** Key events and dates, without task detail <br> **Best used to:** Brief executives\n- [Project network diagram](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - **What it shows:** Tasks as boxes joined by arrows showing dependencies <br> **Best used to:** Find the critical path\n- [PERT chart](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - **What it shows:** Network diagram with three-point duration estimates <br> **Best used to:** Estimate uncertain durations\n- [Budget burndown chart](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - **What it shows:** Budget remaining (or spent) over time <br> **Best used to:** Track spending against plan\n- [Project organizational chart](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - **What it shows:** Team structure and reporting lines <br> **Best used to:** Show who reports to whom\n- [Issue log](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Tracks current issues, owners, status and resolution\n- [Defect log](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Records defects found in testing: severity, steps to reproduce, status\n- [Change log (change control log)](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Records all change requests and decisions\n- [Risk register](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Full catalog of risks with probability, impact, owner and response\n- [Risk report](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Summary of overall risk exposure and top risks for stakeholders\n- [Project dashboard](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Visual display of key metrics (KPIs) at a glance, often live\n- [Project status report](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Periodic update on progress, accomplishments, risks, issues and next steps\n- [Version control tools](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Track revisions of documents and code, support collaboration and rollback\n- [Time-tracking tools](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Record time spent per task for billing, utilization and estimates\n- [Task board](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Visual board (To do, In progress, Done), used in Agile and Kanban\n- [Requirements traceability matrix (RTM)](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Links each requirement to its source, design, test and deliverable, so nothing is missed\n- [Stakeholder register](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - List of stakeholders with interest, influence and engagement strategy\n- [Lessons learned register](03-tools/#31-tools-used-throughout-the-project-life-cycle)\n  - Captures what worked and what did not\n#### 3.2 Project management productivity tools\n- [Communication tools](03-tools/#32-project-management-productivity-tools)\n  - Email (formal, asynchronous), messaging (SMS, chat for quick questions), telephone, face-to-face meetings, video, enterprise social media\n- [Collaboration tools](03-tools/#32-project-management-productivity-tools)\n  - Real-time multi-author editing, file sharing platforms, workflow and e-signature platforms, whiteboards, wiki knowledge bases\n- [Meeting tools](03-tools/#32-project-management-productivity-tools)\n  - Real-time surveys and polling, calendaring, print media, conferencing platforms\n- [Documentation and office tools](03-tools/#32-project-management-productivity-tools)\n  - Word processing, spreadsheets, presentations, charting and diagramming\n- [Project scheduling tools](03-tools/#32-project-management-productivity-tools)\n  - Cloud-based (browser access, vendor maintained, subscription) vs on-premises (local installation, you manage servers and updates, more control)\n- [Ticketing / case management](03-tools/#32-project-management-productivity-tools)\n  - Logs requests and incidents, assigns owners, tracks them to resolution, common in IT support\n- [Accessible anywhere, easy collaboration](03-tools/#32-project-management-productivity-tools)\n  - Data stays inside your network\n- [Vendor handles updates and backup](03-tools/#32-project-management-productivity-tools)\n  - You handle updates, backup and hardware\n- [Subscription (OpEx)](03-tools/#32-project-management-productivity-tools)\n  - License and hardware purchase (CapEx)\n- [Depends on internet and vendor security](03-tools/#32-project-management-productivity-tools)\n  - Better for strict security or offline needs\n#### 3.3 Quality and performance charts\n- [Histogram](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Bar chart of how often values fall into ranges (distribution) <br> **Use to decide:** See the spread of data (for example defect counts)\n- [Pareto chart](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Bars sorted from largest to smallest with a cumulative line (80/20 rule) <br> **Use to decide:** Focus on the \"vital few\" causes\n- [Run chart](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Data points in time order <br> **Use to decide:** See trends, shifts and patterns over time\n- [Scatter diagram](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Two variables plotted as points <br> **Use to decide:** Test for correlation (positive, negative, none)\n- [Fishbone / Ishikawa diagram](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Cause-and-effect branches (people, process, equipment, materials, environment, methods) <br> **Use to decide:** Find root causes\n- [Control chart](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Data over time with mean and upper and lower control limits <br> **Use to decide:** Tell normal variation from special causes. Out of control if points go outside limits or show a run of 7 on one side.\n- [Burnup chart](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Work completed against total scope over time <br> **Use to decide:** Track progress and scope changes\n- [Burndown chart](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Work remaining over time <br> **Use to decide:** See if the sprint or release will finish on time\n- [Velocity chart](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Story points completed per sprint <br> **Use to decide:** Forecast capacity\n- [Decision tree](03-tools/#33-quality-and-performance-charts)\n  - **What it shows:** Branches of choices with probabilities and outcomes <br> **Use to decide:** Pick the option with best expected value\n## 4.0 Basics of IT and Governance\n#### 4.1 Environmental, social and governance (ESG)\n- [Environmental](04-it-governance/#41-environmental-social-and-governance-esg)\n  - Impact on the local and global environment: energy use, e-waste, carbon footprint, sustainable sourcing\n- [Social](04-it-governance/#41-environmental-social-and-governance-esg)\n  - Impact on people and communities: working conditions, diversity, accessibility, local effects\n- [Governance](04-it-governance/#41-environmental-social-and-governance-esg)\n  - Following applicable regulations and standards, ethics, transparency, oversight\n- [Company vision, mission and values](04-it-governance/#41-environmental-social-and-governance-esg)\n  - Project work should align with them\n- [Brand value](04-it-governance/#41-environmental-social-and-governance-esg)\n  - Poor ESG behavior can damage reputation and brand\n#### 4.2 Information security concepts\n- [Physical security](04-it-governance/#42-information-security-concepts)\n  - Facility access (badges, locks, visitor logs), mobile device considerations (loss, theft, encryption), removable media (USB drives can leak or spread malware)\n- [Operational security](04-it-governance/#42-information-security-concepts)\n  - Background screening, security clearance requirements\n- [Digital security](04-it-governance/#42-information-security-concepts)\n  - Resource access and permissions (least privilege), remote access restrictions (VPN), multifactor authentication (MFA: something you know, have, or are)\n- [Data security](04-it-governance/#42-information-security-concepts)\n  - Data classification by sensitivity (public, internal, confidential, restricted), intellectual property, trade secrets, national security information, access on a need-to-know basis\n- [Corporate IT security policies](04-it-governance/#42-information-security-concepts)\n  - Acceptable use, password rules, branding restrictions on what may be shared publicly\n#### 4.3 Compliance and privacy\n- [Data confidentiality](04-it-governance/#43-compliance-and-privacy)\n  - Protecting sensitive data from unauthorized disclosure\n- [Personally identifiable information (PII)](04-it-governance/#43-compliance-and-privacy)\n  - Data that identifies a person: name, address, SSN, email, IP address\n- [Personal (protected) health information (PHI)](04-it-governance/#43-compliance-and-privacy)\n  - Health data linked to a person. Protected in the US by HIPAA.\n- [Legal and regulatory impacts](04-it-governance/#43-compliance-and-privacy)\n  - Laws that affect how the project handles data and operates\n- [Country, state and province privacy rules](04-it-governance/#43-compliance-and-privacy)\n  - Examples: GDPR (EU), CCPA/CPRA (California), PIPEDA (Canada). Rules depend on where the data subject lives, not just where the company sits.\n- [Industry or organization compliance](04-it-governance/#43-compliance-and-privacy)\n  - Examples: HIPAA (health), PCI DSS (payment cards), SOX (financial reporting), FERPA (education records)\n#### 4.4 Basic IT concepts\n- [Infrastructure](04-it-governance/#44-basic-it-concepts)\n  - Computing services, networking and connectivity, storage, and supporting documentation\n- [Multitiered architecture](04-it-governance/#44-basic-it-concepts)\n  - Presentation tier (user interface), application tier (business logic), data tier (database)\n- [Data warehouse](04-it-governance/#44-basic-it-concepts)\n  - Central store of integrated historical data for reporting and analysis\n- [Platform as a service (PaaS)](04-it-governance/#44-basic-it-concepts)\n  - Provider supplies platform and runtime. You deploy apps.\n- [Infrastructure as a service (IaaS)](04-it-governance/#44-basic-it-concepts)\n  - Provider supplies virtual servers, storage and networking. You manage OS and apps.\n- [Software as a service (SaaS)](04-it-governance/#44-basic-it-concepts)\n  - Provider supplies finished software over the internet, usually by subscription\n- [Anything as a service (XaaS)](04-it-governance/#44-basic-it-concepts)\n  - Any capability delivered as a service (security, analytics, desktops)\n- [Enterprise resource planning (ERP)](04-it-governance/#44-basic-it-concepts)\n  - Integrated suite for core business processes (finance, HR, supply chain)\n- [Customer relationship management (CRM)](04-it-governance/#44-basic-it-concepts)\n  - Manages customer data, sales and service interactions\n- [Database](04-it-governance/#44-basic-it-concepts)\n  - Organized storage of structured data\n- [Electronic document and record management system (EDRMS)](04-it-governance/#44-basic-it-concepts)\n  - Stores, controls and retains documents and records\n- [Content management system (CMS)](04-it-governance/#44-basic-it-concepts)\n  - Creates and manages web or digital content\n- [Financial systems](04-it-governance/#44-basic-it-concepts)\n  - Accounting, billing, payroll and budgeting software\n#### 4.5 Operational change control during an IT project\n- [IT infrastructure change control](04-it-governance/#45-operational-change-control-during-an-it-project)\n  - Schedule downtime or maintenance windows, send customer notifications, prepare a rollback plan, run validation checks after the change\n- [Software change control](04-it-governance/#45-operational-change-control-during-an-it-project)\n  - Define requirements, assess risk, test (automated and manual), obtain approval, notify customers, release\n- [Cloud vs on-premises change control](04-it-governance/#45-operational-change-control-during-an-it-project)\n  - Cloud: provider controls some changes, so follow provider notice and shared-responsibility terms. On-premises: you control the whole stack and the change window.\n- [CI/CD](04-it-governance/#45-operational-change-control-during-an-it-project)\n  - Continuous integration merges and tests code often. Continuous delivery keeps code always releasable. Continuous deployment releases automatically to production.\n- [Production vs beta / staging](04-it-governance/#45-operational-change-control-during-an-it-project)\n  - Staging or beta mirrors production so changes can be tested safely before release. Production is the live environment.\n- [Tiered environments](04-it-governance/#45-operational-change-control-during-an-it-project)\n  - Development, test, staging/beta and production, with promotion between them after approval\n## Gaps filled from the All-in-One Exam Guide\n#### How CompTIA words things (traps)\n- [Phases](05-gaps/#how-comptia-words-things-traps)\n  - **It means:** The five PMI process groups: initiating, planning, executing, monitoring and controlling, closing. The objectives themselves list discovery as the first phase and treat monitoring and controlling as running alongside, so if a question asks which phase an activity belongs to, use the phase list in objective 2.0 <br> **Why it matters:** Questions ask \"which phase\" for things like stakeholder identification (initiation) or EVM (monitoring and controlling)\n- [Waterfall](05-gaps/#how-comptia-words-things-traps)\n  - **It means:** Predictive, plan-driven <br> **Why it matters:** Treat the two words as the same thing\n- [Agile / adaptive](05-gaps/#how-comptia-words-things-traps)\n  - **It means:** Iterative, change-welcoming <br> **Why it matters:** Adaptive projects do *not* use a scope statement, WBS, network diagram or formal change control. They use a product backlog, product roadmap and reprioritization instead.\n- [Projects vs operations](05-gaps/#how-comptia-words-things-traps)\n  - **It means:** Temporary and unique vs ongoing and repetitive <br> **Why it matters:** Expect at least one question that asks you to tell them apart\n#### Activities by phase (know what happens where)\n- [Initiating](05-gaps/#activities-by-phase-know-what-happens-where)\n  - Create the charter, identify stakeholders\n- [Planning](05-gaps/#activities-by-phase-know-what-happens-where)\n  - Project management plan, scope statement, WBS, activity list and sequence, estimates, schedule, budget, quality plan, resource plan, communications plan, risk plan and register, procurement plan, stakeholder engagement plan\n- [Executing](05-gaps/#activities-by-phase-know-what-happens-where)\n  - Direct the work, manage quality, acquire and develop the team, manage communications, implement risk responses, conduct procurements, manage stakeholder engagement\n- [Monitoring and controlling](05-gaps/#activities-by-phase-know-what-happens-where)\n  - Integrated change control, validate scope, control scope/schedule/cost, quality control, EVM, monitor risks, administer procurements\n- [Closing](05-gaps/#activities-by-phase-know-what-happens-where)\n  - Close the project or phase, formal acceptance, close contracts, release resources, archive, lessons learned\n#### Estimating\n- [Rough order of magnitude (ROM)](05-gaps/#estimating)\n  - **When:** Initiating, top-down <br> **Accuracy:** Least accurate (about \u221225% to +75%)\n- [Budget estimate](05-gaps/#estimating)\n  - **When:** Early planning, scope approved, top-down <br> **Accuracy:** Moderate (about \u221210% to +25%)\n- [Definitive estimate](05-gaps/#estimating)\n  - **When:** Late planning, built from the WBS, bottom-up <br> **Accuracy:** Most accurate (about \u22125% to +10%), slowest to create\n#### Cost types\n- [Direct](05-gaps/#cost-types)\n  - **Definition:** Charged only to this project <br> **Example:** Team travel, equipment leased for this project\n- [Indirect](05-gaps/#cost-types)\n  - **Definition:** Cost of doing business, shared <br> **Example:** Rent, utilities, phone\n- [Fixed](05-gaps/#cost-types)\n  - **Definition:** Constant regardless of usage <br> **Example:** Monthly equipment rental\n- [Variable](05-gaps/#cost-types)\n  - **Definition:** Changes with quantity <br> **Example:** Catering per attendee, licenses per user\n- [Cost of conformance](05-gaps/#cost-types)\n  - **Definition:** Money spent to get quality right: training, testing, standards <br> **Example:** Prevention and appraisal\n- [Cost of nonconformance](05-gaps/#cost-types)\n  - **Definition:** Cost of failure: rework, downtime, lost sales, waste <br> **Example:** Internal and external failure\n#### Quality: assurance vs control\n#### People and power\n- [Formal / legitimate / positional](05-gaps/#people-and-power)\n  - Assigned by senior management (the charter)\n- [Reward](05-gaps/#people-and-power)\n  - Ability to give bonuses, recognition, good assignments\n- [Coercive / penalty](05-gaps/#people-and-power)\n  - Ability to discipline. Team works out of fear.\n- [Expert](05-gaps/#people-and-power)\n  - The PM's own knowledge of the subject\n- [Referent](05-gaps/#people-and-power)\n  - Team likes the PM, or the PM references someone powerful (\"the CEO wants this\")\n- [Maslow's hierarchy](05-gaps/#people-and-power)\n  - Physiological, safety, social, esteem, self-actualization, in that order\n- [Herzberg](05-gaps/#people-and-power)\n  - Hygiene factors (pay, safety, job security) only prevent dissatisfaction. Motivators (recognition, responsibility, growth) drive performance.\n- [McGregor X and Y](05-gaps/#people-and-power)\n  - Theory X: people are lazy and need micromanagement. Theory Y: people are self-motivated.\n- [Ouchi Theory Z](05-gaps/#people-and-power)\n  - Participative management, commitment and long-term opportunity motivate\n- [McClelland](05-gaps/#people-and-power)\n  - Needs for achievement, affiliation and power, shaped by experience\n- [Vroom expectancy](05-gaps/#people-and-power)\n  - People work in proportion to the reward they expect\n#### Scope, requirements and selection\n#### Schedule and risk extras\n#### Change and release extras\n#### Procurement extras\n#### Closing extras\n#### Communication arithmetic trap\n";
